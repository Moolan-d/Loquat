<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFF7EA"/>
      <stop offset="1" stop-color="#FFD79C"/>
    </linearGradient>

    <linearGradient id="skin" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#FFC64F"/>
      <stop offset="0.55" stop-color="#FB9A21"/>
      <stop offset="1" stop-color="#EC6C0F"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.34" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.46"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3F8C2F"/>
      <stop offset="1" stop-color="#79C24E"/>
    </linearGradient>

    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <path id="body" d="M512,330
      C588,330 682,400 706,505
      C730,615 655,760 512,760
      C482,760 452,757 430,752
      C400,790 365,818 335,838
      C348,790 358,742 360,700
      C336,640 306,570 318,505
      C342,400 436,330 512,330 Z"/>
  </defs>

  <!-- 背景采用真超椭圆而非圆角矩形，与 Dock 里的系统图标共用同一种轮廓 -->
  <path fill="url(#bg)" d="M924.00,512.00C924.00,583.43 922.96,679.52 920.81,726.28C918.67,773.05 915.51,774.00 911.16,792.56C906.80,811.13 901.43,824.66 894.68,837.68C887.93,850.70 880.17,861.17 870.67,870.67C861.17,880.17 850.70,887.93 837.68,894.68C824.66,901.43 811.13,906.80 792.56,911.16C774.00,915.51 773.05,918.67 726.28,920.81C679.52,922.96 583.43,924.00 512.00,924.00C440.57,924.00 344.48,922.96 297.72,920.81C250.95,918.67 250.00,915.51 231.44,911.16C212.87,906.80 199.34,901.43 186.32,894.68C173.30,887.93 162.83,880.17 153.33,870.67C143.83,861.17 136.07,850.70 129.32,837.68C122.57,824.66 117.20,811.13 112.84,792.56C108.49,774.00 105.33,773.05 103.19,726.28C101.04,679.52 100.00,583.43 100.00,512.00C100.00,440.57 101.04,344.48 103.19,297.72C105.33,250.95 108.49,250.00 112.84,231.44C117.20,212.87 122.57,199.34 129.32,186.32C136.07,173.30 143.83,162.83 153.33,153.33C162.83,143.83 173.30,136.07 186.32,129.32C199.34,122.57 212.87,117.20 231.44,112.84C250.00,108.49 250.95,105.33 297.72,103.19C344.48,101.04 440.57,100.00 512.00,100.00C583.43,100.00 679.52,101.04 726.28,103.19C773.05,105.33 774.00,108.49 792.56,112.84C811.13,117.20 824.66,122.57 837.68,129.32C850.70,136.07 861.17,143.83 870.67,153.33C880.17,162.83 887.93,173.30 894.68,186.32C901.43,199.34 906.80,212.87 911.16,231.44C915.51,250.00 918.67,250.95 920.81,297.72C922.96,344.48 924.00,440.57 924.00,512.00Z"/>

  <!-- 果实投影：整条轮廓下移后模糊，尾巴也一起投影，形状才站得住 -->
  <g transform="translate(0,26)" opacity="0.20" filter="url(#cast)">
    <use href="#body" fill="#7A3B00"/>
  </g>

  <!-- 枝干与叶片压在果实之下，让果实的上缘保持完整 -->
  <path d="M516,352 C520,318 530,294 548,276"
        stroke="#8A5A2B" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path fill="url(#leaf)"
        d="M540,290 Q606,186 722,166 Q708,296 600,330 Q548,340 540,290 Z"/>
  <path d="M554,292 Q622,250 714,172"
        stroke="#2E6B22" stroke-width="11" stroke-linecap="round"
        fill="none" opacity="0.42"/>

  <!-- 果实本体：兼作对话气泡，尾巴呼应词根 loqu-「说」 -->
  <use href="#body" fill="url(#skin)"/>
  <use href="#body" fill="url(#sheen)"/>

  <!-- A 与 文：翻译类应用的通用符号。用描边而非字体，避免依赖系统字体 -->
  <g transform="translate(512,550) scale(0.85) translate(-512,-550)"
     stroke="#FFFFFF" stroke-width="33" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M368,630 L424,470 L480,630"/>
    <path d="M391,583 L457,583"/>
    <path d="M600,462 L600,482"/>
    <path d="M540,506 L660,506"/>
    <path d="M644,528 C618,576 578,604 544,632"/>
    <path d="M556,528 C582,576 622,604 656,632"/>
  </g>
</svg>
